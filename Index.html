<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>File Sharing Application</title>

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

    <div class="container">

        <h1>File Sharing Application</h1>

        <p class="description">
            Upload and share your files easily
        </p>


        <!-- Upload Form -->

        <form action="/upload"
              method="POST"
              enctype="multipart/form-data">

            <input
                type="file"
                name="file"
                required>

            <button type="submit">
                Upload File
            </button>

        </form>


        <!-- File List -->

        <h2>Uploaded Files</h2>

        <div id="fileList">

            <p>Loading files...</p>

        </div>

    </div>


    <script>

        // Load files from backend

        async function loadFiles() {

            const response =
                await fetch("/files");

            const files =
                await response.json();

            const fileList =
                document.getElementById("fileList");

            fileList.innerHTML = "";


            if (files.length === 0) {

                fileList.innerHTML =
                    "<p>No files uploaded yet.</p>";

                return;
            }


            files.forEach(file => {

                const div =
                    document.createElement("div");

                div.className = "file";


                div.innerHTML = `

                    <span>
                        📄 ${file}
                    </span>

                    <div>

                        <a
                            href="/download/${encodeURIComponent(file)}">

                            <button>
                                Download
                            </button>

                        </a>


                        <button
                            class="delete"
                            onclick="deleteFile('${encodeURIComponent(file)}')">

                            Delete

                        </button>

                    </div>

                `;


                fileList.appendChild(div);

            });

        }


        // Delete file

        async function deleteFile(file) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this file?"
                );


            if (!confirmDelete) {
                return;
            }


            const response =
                await fetch(
                    "/delete/" + file,
                    {
                        method: "DELETE"
                    }
                );


            if (response.ok) {

                alert(
                    "File deleted successfully"
                );

                loadFiles();

            } else {

                alert(
                    "Unable to delete file"
                );

            }

        }


        // Load files when page opens

        loadFiles();

    </script>

</body>

</html>
